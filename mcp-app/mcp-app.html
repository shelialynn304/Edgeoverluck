<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Odds Analysis</title>
</head>
<body>
  <main class="main">
    <div class="summary">
      <span class="summary-item"><span class="summary-label">Overround</span> <span id="overround">—</span></span>
      <span class="summary-item"><span class="summary-label">Effective takeout</span> <span id="takeout">—</span></span>
    </div>

    <table class="odds-table">
      <thead>
        <tr>
          <th>#</th>
          <th>Odds</th>
          <th>Implied win %</th>
          <th>Fair odds</th>
          <th>Your estimate %</th>
          <th>Edge</th>
        </tr>
      </thead>
      <tbody id="odds-rows"></tbody>
    </table>

    <p class="hint">Enter your own win-probability estimate for a horse to see whether the board price is an overlay (+EV) or underlay.</p>
  </main>
  <script type="module" src="/src/mcp-app.ts"></script>
</body>
</html>
